[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-secure-schema"
version = "1.0.0"
description = "Read-only MCP server for exposing database schema metadata without row data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.4.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mcp-secure-schema = "server:main"

[project.urls]
Homepage = "https://github.com/Siddharth-coder13/secure_schema_mcp"
Repository = "https://github.com/Siddharth-coder13/secure_schema_mcp"
Issues = "https://github.com/Siddharth-coder13/secure_schema_mcp/issues"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
